name: Validar site

on:
  push:
    branches:
      - main
      - "chore/**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências reproduzíveis
        run: npm ci --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Verificar saída
        run: |
          test -f dist/index.html
          grep -q "Café Aurora" dist/index.html
