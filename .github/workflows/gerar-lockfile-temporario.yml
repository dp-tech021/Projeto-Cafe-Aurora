name: Gerar lockfile para homologacao (temporario)

on:
  push:
    branches: ['chore/homologacao-ci-pages-20261108']

permissions:
  contents: write

jobs:
  fixar-dependencias:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolver lockfile pelo registro npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validar instalacao, testes e build
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          test -f dist/index.html
      - name: Versionar lockfile na branch de homologacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: registrar package-lock gerado pelo npm"
            git push origin HEAD:chore/homologacao-ci-pages-20261108
          fi
